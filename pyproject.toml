[project]
name = "polymarket-edge"
version = "0.1.0"
description = "Modular Polymarket predictive trading platform with multiple strategies, backtesting, and risk management"
requires-python = ">=3.11"
dependencies = [
    "py-clob-client>=0.1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "nautilus_trader>=1.225.0",
    "httpx>=0.27",
    "websockets>=12.0",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "numpy>=1.26",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
ai = [
    "openai>=1.0",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
]
dashboard = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
