services:
  - type: web
    name: polymarket-edge
    runtime: python
    buildCommand: pip install ".[dashboard,ai]" && cd src/dashboard/frontend && npm ci && npm run build
    startCommand: uvicorn src.dashboard.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: POSTGRES_HOST
        fromDatabase:
          name: polymarket-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: polymarket-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: polymarket-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: polymarket-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: polymarket-db
          property: password
      - key: REDIS_HOST
        fromService:
          name: polymarket-redis
          type: redis
          property: host
      - key: REDIS_PORT
        fromService:
          name: polymarket-redis
          type: redis
          property: port
      # Secret env vars — set manually in Render dashboard
      - key: LIVE_MODE
        sync: false
      - key: SHADOW_MODE
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_API_SECRET
        sync: false
      - key: POLYMARKET_API_PASSPHRASE
        sync: false
      - key: OPENAI_API_KEY
        sync: false
  - key: ANTHROPIC_API_KEY
    sync: false
      - key: POLYGON_WALLET_ADDRESS
        sync: false
      - key: POLYGON_WALLET_PRIVATE_KEY
        sync: false
      - key: KALSHI_API_KEY
        sync: false
      - key: KALSHI_API_SECRET
        sync: false
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_API_SECRET
        sync: false
      - key: COINBASE_API_KEY
        sync: false
      - key: COINBASE_API_SECRET
        sync: false
      # Risk limits — safe defaults, override in dashboard if needed
      - key: MAX_DAILY_LOSS_PCT
        value: "5"
      - key: MAX_MONTHLY_LOSS_PCT
        value: "15"
      - key: MAX_DRAWDOWN_PCT
        value: "25"
      - key: MAX_POSITION_SIZE_USD
        value: "500"
      - key: MAX_TOTAL_EXPOSURE_USD
        value: "5000"

databases:
  - name: polymarket-db
    plan: starter

  services:
 - type: redis
  name: polymarket-redis
  plan: starter
  maxmemoryPolicy: no-eviction
