services:
  - type: web
    name: polymarket-edge
    runtime: python
    buildCommand: pip install ".[dashboard,ai]" && cd src/dashboard/frontend && npm ci && npm run build
    startCommand: uvicorn src.dashboard.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: POSTGRES_HOST
        fromDatabase:
          name: polymarket-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: polymarket-db
          property: port
      - key: POSTGRES_DB
        fromDatabase:
          name: polymarket-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: polymarket-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: polymarket-db
          property: password
      - key: REDIS_HOST
        fromService:
          name: polymarket-redis
          type: redis
          property: host
      - key: LIVE_MODE
        sync: false
      - key: SHADOW_MODE
        sync: false
      - key: POLYMARKET_API_KEY
        sync: false
      - key: POLYMARKET_API_SECRET
        sync: false
      - key: POLYMARKET_API_PASSPHRASE
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: polymarket-db
    plan: starter

  - type: redis
    name: polymarket-redis
    plan: starter
